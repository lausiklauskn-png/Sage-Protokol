<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wie zwei sich finden — SBKIM-Zusammenarbeit, Schritt für Schritt</title>
<style>
  :root{
    --bg:#0b0a16; --bg2:#13112a; --ink:#f3efe6; --muted:#b9b3a6; --dim:#7d7868;
    --gold:#d6b76a; --teal:#6ee7d3; --line:rgba(255,255,255,0.14);
    --glass:rgba(255,255,255,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:radial-gradient(120% 90% at 50% 0%, #1a1733 0%, var(--bg) 60%);color:var(--ink);font-family:Inter,system-ui,sans-serif;}
  .wrap{max-width:880px;margin:0 auto;padding:1.4rem 1.1rem 4rem;}
  .back{display:inline-block;color:var(--muted);text-decoration:none;font-size:0.9rem;margin-bottom:1rem;}
  .back:hover{color:var(--gold);}
  .eyebrow{font-family:"Geist Mono",ui-monospace,monospace;font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;margin:0.4rem 0 0.6rem;}
  .lede{color:var(--muted);max-width:60ch;line-height:1.55;margin:0 0 1.4rem;}
  .film{margin:0 0 1.4rem;}
  .film video{display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:18px;border:1px solid var(--line);background:#05060f;}
  .film figcaption{color:var(--dim);font-size:0.85rem;margin-top:0.5rem;line-height:1.5;}
  @media print{.film{display:none;}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./index.html">← zurück zur Einladung</a>
  <p class="eyebrow">SBKIM · Demo</p>
  <h1>Wie zwei sich finden — ohne zu suchen.</h1>
  <p class="lede">
    Viele Knoten, kein Zentrum, keine Hierarchie. Wie arbeiten getrennte Systeme
    zusammen, wenn keiner der Chef ist? Der Film erzählt es in einer knappen Minute.
  </p>

  <figure class="film">
    <video controls playsinline preload="none"
           poster="./vendor/img/wie-zwei-sich-finden.webp"
           aria-label="Film: Wie zwei sich finden, mit Sprecher">
      <source src="./vendor/video/wie-zwei-sich-finden.mp4" type="video/mp4">
      <track kind="captions" srclang="de" label="Deutsch" src="./vendor/video/wie-zwei-sich-finden.de.vtt">
    </video>
    <figcaption>57 Sekunden, mit Ton. Zwei Knoten als Blasen: ein Rezeptbuch und ein Cocktail-Tool.</figcaption>
  </figure>

</div>

</body>
</html>
